project_id = "subjective-guess-who"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true
enable_anonymous_sign_ins = true

[auth.rate_limit]
anonymous_users = 30

# Production: enable Cloudflare Turnstile in the Supabase Auth dashboard.
# Keep the Turnstile SECRET there, never in VITE_ environment variables.
